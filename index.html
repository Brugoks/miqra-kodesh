<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- interactive-widget=resizes-content: when the on-screen keyboard opens,
         resize the layout viewport (and dvh units) instead of panning the page
         upward and hiding the top bar. iOS ignores this; see useMobileKeyboardFit. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f8fafc" />
    <!-- Resolve the theme before first paint. Without this the app renders one
         light frame and then flips, which is very visible on a dark OS. Kept in
         sync with resolveTheme()/applyTheme() in src/lib/theme.js. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('miqra_theme');
          if (mode !== 'light' && mode !== 'dark') mode = 'system';
          if (mode !== 'system') document.documentElement.setAttribute('data-theme', mode);
          var dark = mode === 'dark' || (mode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0b1120' : '#f8fafc');
        } catch (e) { /* storage blocked — fall through to the light default */ }
      })();
    </script>
    <!-- Native-app feel when installed / launched on mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Miqra Kodesh" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Miqra Kodesh - Fellowship Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
